```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
        .calc-btn { transition: transform 0.08s ease, background-color 0.1s ease; }
        .calc-btn:active { transform: scale(0.92); filter: brightness(0.93); }
    </style>
</head>
<body class="w-full h-screen flex items-center justify-center bg-white overflow-hidden">

    <main class="w-full h-full max-w-[480px] bg-white flex flex-col justify-between p-4">
        
        <!-- الشريط العلوي -->
        <header class="flex items-center justify-between pb-3 border-b border-gray-100" dir="ltr">
            <span class="font-bold text-base text-gray-900">Calculator History</span>
            <div class="flex items-center gap-2" dir="rtl">
                <button type="button" onclick="openBioSettings()" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full text-xs font-bold border border-blue-200">
                    تفعيل البصمة
                </button>
            </div>
        </header>

        <!-- شاشة تفعيل البصمة -->
        <div id="bioModal" class="hidden absolute inset-0 bg-white z-50 flex flex-col justify-between p-6 text-center">
            <div class="flex justify-between items-center border-b pb-3">
                <span class="text-sm font-bold">إعداد بصمة الحماية</span>
                <button type="button" onclick="closeBioSettings()" class="text-xs bg-gray-100 px-3 py-1 rounded-full">إغلاق ✕</button>
            </div>
            <div class="my-auto space-y-4">
                <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-right">
                    <p class="text-xs text-blue-800 font-bold mb-1">تعليمات:</p>
                    <p class="text-[11px] text-blue-700">اضغط على زر التفعيل أدناه لربط بصمة هاتفك بالحاسبة.</p>
                </div>
                <button type="button" onclick="enableBiometric()" class="w-full py-3.5 rounded-xl bg-blue-600 text-white font-bold text-sm shadow-lg">
                    تفعيل بصمة الهاتف الآن
                </button>
            </div>
            <div></div>
        </div>

        <!-- الشاشة ومنطقة العمليات -->
        <section class="flex-1 flex flex-col justify-between py-2">
            <!-- آخر عملية سابقة في الأعلى -->
            <div onclick="useLastResult()" class="cursor-pointer bg-gray-50 border border-gray-200 rounded-2xl p-3 flex flex-col items-end" dir="ltr">
                <div class="w-full flex justify-between text-xs text-gray-400 mb-1" dir="rtl">
                    <span class="text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded">آخر عملية</span>
                    <span id="lastEquation">0 =</span>
                </div>
                <div id="lastResult" class="text-2xl font-bold text-gray-800">0</div>
            </div>

            <!-- الشاشة الحالية -->
            <div class="my-auto text-right" dir="ltr">
                <div id="currentInput" class="text-4xl font-light text-gray-900 overflow-x-auto whitespace-nowrap">0</div>
                <div id="livePreview" class="text-xl font-medium text-gray-400 h-6"></div>
            </div>

            <!-- أزرار الإجراءات السريعة -->
            <div class="flex items-center justify-between text-gray-500 border-t border-b py-2" dir="ltr">
                <button type="button" onclick="clearHistory()" class="text-xs text-red-500 font-medium">مسح السجل</button>
                <button type="button" onclick="backspace()" class="text-blue-600 font-bold">⌫ حذف</button>
            </div>
        </section>

        <!-- لوحة الأزرار الحسابية -->
        <section class="grid grid-cols-4 gap-2.5 pb-2" dir="ltr">
            <button type="button" onclick="clearAll()" class="calc-btn h-14 rounded-2xl bg-gray-100 text-red-500 text-xl font-bold">C</button>
            <button type="button" onclick="appendValue('(')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-blue-600 text-xl font-semibold">(</button>
            <button type="button" onclick="appendValue('%')" class="calc-btn h-14 rounded-2xl bg-blue-50 text-blue-600 text-2xl font-bold">%</button>
            <button type="button" onclick="appendValue('÷')" class="calc-btn h-14 rounded-2xl bg-blue-50 text-blue-600 text-2xl font-semibold">÷</button>

            <button type="button" onclick="appendValue('7')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium">7</button>
            <button type="button" onclick="appendValue('8')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium">8</button>
            <button type="button" onclick="appendValue('9')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium">9</button>
            <button type="button" onclick="appendValue('×')" class="calc-btn h-14 rounded-2xl bg-blue-50 text-blue-600 text-2xl font-semibold">×</button>

            <button type="button" onclick="appendValue('4')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium">4</button>
            <button type="button" onclick="appendValue('5')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium">5</button>
            <button type="button" onclick="appendValue('6')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium">6</button>
            <button type="button" onclick="appendValue('-')" class="calc-btn h-14 rounded-2xl bg-blue-50 text-blue-600 text-3xl">-</button>

            <button type="button" onclick="appendValue('1')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium">1</button>
            <button type="button" onclick="appendValue('2')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium">2</button>
            <button type="button" onclick="appendValue('3')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium">3</button>
            <button type="button" onclick="appendValue('+')" class="calc-btn h-14 rounded-2xl bg-blue-50 text-blue-600 text-2xl font-semibold">+</button>

            <button type="button" onclick="appendValue('0')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-medium col-span-2">0</button>
            <button type="button" onclick="appendValue('.')" class="calc-btn h-14 rounded-2xl bg-gray-100 text-gray-900 text-2xl font-bold">.</button>
            <button type="button" onclick="calculate()" class="calc-btn h-14 rounded-2xl bg-blue-600 text-white text-3xl font-semibold">=</button>
        </section>
    </main>

    <script>
        let currentInput = '0';
        let historyList = [];
        let isEnrolled = localStorage.getItem('bio_enrolled') === 'true';

        function updateScreen() {
            document.getElementById('currentInput').textContent = currentInput;
            try {
                let clean = currentInput.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/%/g, '/100');
                if (!/[+\-*/.]$/.test(clean)) {
                    let res = eval(clean);
                    if (res !== undefined && !isNaN(res)) {
                        document.getElementById('livePreview').textContent = res;
                    } else {
                        document.getElementById('livePreview').textContent = '';
                    }
                }
            } catch (e) {
                document.getElementById('livePreview').textContent = '';
            }
        }

        function appendValue(val) {
            if (currentInput === '0' && val !== '.') {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateScreen();
        }

        function clearAll() {
            currentInput = '0';
            updateScreen();
        }

        function backspace() {
            currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
            updateScreen();
        }

        function calculate() {
            try {
                let clean = currentInput.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/%/g, '/100');
                let res = eval(clean);
                if (res !== undefined && !isNaN(res)) {
                    historyList.unshift({ eq: currentInput, res: res });
                    if (historyList.length > 20) historyList.pop();
                    updateHistoryBar();
                    currentInput = res.toString();
                }
            } catch (e) {
                currentInput = 'خطأ';
            }
            updateScreen();
        }

        function updateHistoryBar() {
            if (historyList.length > 0) {
                document.getElementById('lastEquation').textContent = historyList[0].eq + ' =';
                document.getElementById('lastResult').textContent = historyList[0].res;
            }
        }

        function useLastResult() {
            if (historyList.length > 0) {
                currentInput = historyList[0].res.toString();
                updateScreen();
            }
        }

        function clearHistory() {
            historyList = [];
            document.getElementById('lastEquation').textContent = '0 =';
            document.getElementById('lastResult').textContent = '0';
        }

        function openBioSettings() {
            document.getElementById('bioModal').classList.remove('hidden');
        }

        function closeBioSettings() {
            document.getElementById('bioModal').classList.add('hidden');
        }

        async function enableBiometric() {
            try {
                if (window.PublicKeyCredential) {
                    localStorage.setItem('bio_enrolled', 'true');
                    alert('تم تفعيل البصمة بنجاح!');
                    closeBioSettings();
                } else {
                    alert('مستشعر البصمة غير مدعوم في هذا المتصفح');
                }
            } catch (e) {
                alert('حدث خطأ أثناء التفعيل');
            }
        }

        updateScreen();
    </script>
</body>
</html>
